<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 700" role="img" aria-labelledby="title"><title id="title">Runtime processes and data flow</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#407b87"/></marker></defs><rect width="100%" height="100%" fill="#f8fbfd"/><rect x="15" y="20" width="245" height="105" rx="10" fill="#e5f3ef" stroke="#c5d8e0"/><text x="30" y="47" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">Editable configuration</text><text x="30" y="73" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">events / rules / view</text><text x="30" y="95" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Source IDs + labels</text><rect x="300" y="20" width="505" height="105" rx="10" fill="#e5f3ef" stroke="#c5d8e0"/><text x="315" y="47" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">Accepted configuration</text><text x="315" y="73" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Events + rules + source IDs + view</text><text x="315" y="95" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">One configuration watcher inside service</text><rect x="290" y="155" width="530" height="465" rx="16" fill="#eaf1f8" stroke="#b3cadb"/><text x="308" y="181" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#203d4e">ONE PYTHON HTTP SERVICE PROCESS</text><rect x="15" y="210" width="245" height="145" rx="10" fill="#ffffff" stroke="#c5d8e0"/><text x="30" y="237" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">Producer</text><text x="30" y="259" font-family="system-ui, sans-serif" font-size="11" font-weight="400" fill="#567180">SEPARATE PYTHON PROCESS</text><text x="30" y="282" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Separate simulation.json</text><text x="30" y="304" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">2 Hz per entity/type</text><text x="30" y="326" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Source-issued IDs stay intact</text><rect x="310" y="210" width="225" height="145" rx="10" fill="#ffffff" stroke="#c5d8e0"/><text x="325" y="237" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">Edge</text><text x="325" y="263" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Validate source + ID</text><text x="325" y="285" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Thresholds or source alarms</text><text x="325" y="307" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">CloudEvents + gauge payload</text><rect x="575" y="210" width="225" height="145" rx="10" fill="#ffffff" stroke="#c5d8e0"/><text x="590" y="237" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">EventBus</text><text x="590" y="263" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Deduplicate occurrences</text><text x="590" y="285" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Latest state + bounded queues</text><text x="590" y="307" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Same public event to readers</text><rect x="875" y="140" width="250" height="90" rx="10" fill="#e5f3ef" stroke="#c5d8e0"/><text x="890" y="167" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">Console</text><text x="890" y="193" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Shared Client → log values</text><text x="890" y="215" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Live-only command</text><rect x="875" y="365" width="250" height="110" rx="10" fill="#e5f3ef" stroke="#c5d8e0"/><text x="890" y="392" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">Kit client</text><text x="890" y="418" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Shared Client → UI / USD</text><text x="890" y="440" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">PlaybackController → timeline</text><rect x="875" y="245" width="250" height="95" rx="10" fill="#e5f3ef" stroke="#c5d8e0"/><text x="890" y="272" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">ovui client</text><text x="890" y="298" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Shared Client → Dashboard</text><text x="890" y="320" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Live 2D gauges / no Kit</text><rect x="875" y="20" width="250" height="105" rx="10" fill="#fff3dc" stroke="#c5d8e0"/><text x="890" y="47" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">Prebuilt USD</text><text x="890" y="73" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Geometry + source-issued IDs</text><text x="890" y="95" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Customer authors / Kit reads</text><path d="M1125 74H1132V420H1125" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><rect x="575" y="495" width="225" height="110" rx="10" fill="#ffffff" stroke="#c5d8e0"/><text x="590" y="522" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">FileRecorder</text><text x="590" y="548" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Async writer → JSONL</text><text x="590" y="570" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Snapshot + events + config</text><rect x="875" y="535" width="250" height="110" rx="10" fill="#ffffff" stroke="#c5d8e0"/><text x="890" y="562" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">Local capture replay</text><text x="890" y="588" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Download and index a capture</text><text x="890" y="610" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Replay local capture only</text><path d="M260 65H293" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><text x="266" y="52" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">files</text><path d="M310 239H277V170H140V202" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="20" y="160" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">GET /producer-config response</text><path d="M550 125V195" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><text x="565" y="148" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">validated revision</text><path d="M260 278H304" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><text x="267" y="261" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">POST</text><path d="M535 278H568" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><path d="M800 255H844V193H868" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><text x="831" y="176" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">SSE</text><path d="M800 292H868" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><text x="825" y="282" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">SSE</text><path d="M800 330H842V420H868" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><text x="827" y="405" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">SSE</text><path d="M687 355V487" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><text x="698" y="457" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">queue</text><path d="M800 548H837V590H868" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><text x="803" y="526" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">HTTP file</text><path d="M1000 535V482" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><text x="1010" y="512" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">snapshots</text><text x="15" y="418" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#203d4e">Kit loads prebuilt USD + assetInfo.</text><text x="15" y="449" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Each reader has one SSE stream</text><text x="15" y="471" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">covering all bindings.</text><text x="15" y="510" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">No database or external broker.</text><text x="15" y="551" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Credentials and endpoints</text><text x="15" y="573" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">stay outside USD.</text><text x="323" y="434" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">FileRecorder runs inside</text><text x="323" y="456" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">the service process.</text><text x="880" y="676" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Replay runs in the Kit client.</text></svg>