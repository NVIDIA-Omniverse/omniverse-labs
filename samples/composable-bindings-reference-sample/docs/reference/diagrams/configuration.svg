<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 350" role="img" aria-labelledby="title"><title id="title">Configuration publication and live reload</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#407b87"/></marker></defs><rect width="100%" height="100%" fill="#f8fbfd"/><rect x="15" y="35" width="290" height="120" rx="10" fill="#e5f3ef" stroke="#c5d8e0"/><text x="30" y="62" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">Editable files</text><text x="30" y="88" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">events / rules / view</text><text x="30" y="110" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Source IDs + additions</text><rect x="380" y="35" width="290" height="120" rx="10" fill="#ffffff" stroke="#c5d8e0"/><text x="395" y="62" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">Service config watcher</text><text x="395" y="88" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Validate full combination</text><text x="395" y="110" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Write immutable snapshot</text><rect x="745" y="35" width="290" height="120" rx="10" fill="#ffffff" stroke="#c5d8e0"/><text x="760" y="62" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">Atomic selector update</text><text x="760" y="88" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Service watcher accepts revision</text><text x="760" y="110" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Old producer revision rejected</text><rect x="380" y="220" width="290" height="110" rx="10" fill="#e5f3ef" stroke="#c5d8e0"/><text x="395" y="247" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">Producer</text><text x="395" y="273" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Read contract + simulation</text><text x="395" y="295" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Emit compatible new readings</text><rect x="745" y="220" width="290" height="110" rx="10" fill="#e5f3ef" stroke="#c5d8e0"/><text x="760" y="247" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">Readers</text><text x="760" y="273" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Receive config snapshot</text><text x="760" y="295" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Rebuild affected presentation</text><path d="M305 95H372" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><text x="321" y="82" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">poll</text><path d="M670 95H737" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><text x="681" y="82" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">publish</text><path d="M820 155V185H525V212" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><text x="602" y="177" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">accepted config</text><path d="M900 155V212" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><text x="913" y="191" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">SSE</text><text x="20" y="247" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Invalid edits keep the last valid revision.</text><text x="20" y="276" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">No client restart or reconnect is needed.</text></svg>