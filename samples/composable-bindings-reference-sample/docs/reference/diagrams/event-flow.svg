<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" role="img" aria-labelledby="title"><title id="title">One reading, from calculation to visualization</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#407b87"/></marker></defs><rect width="100%" height="100%" fill="#f8fbfd"/><rect x="20" y="20" width="235" height="64" rx="10" fill="#e5f3ef" stroke="#c5d8e0"/><text x="35" y="47" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">Producer</text><path d="M137 85V487" stroke="#c4d2db" stroke-dasharray="4 5"/><rect x="270" y="20" width="235" height="64" rx="10" fill="#e5f3ef" stroke="#c5d8e0"/><text x="285" y="47" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">Edge + Service</text><path d="M387 85V487" stroke="#c4d2db" stroke-dasharray="4 5"/><rect x="535" y="20" width="235" height="64" rx="10" fill="#e5f3ef" stroke="#c5d8e0"/><text x="550" y="47" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">EventBus</text><path d="M652 85V487" stroke="#c4d2db" stroke-dasharray="4 5"/><rect x="800" y="20" width="235" height="64" rx="10" fill="#e5f3ef" stroke="#c5d8e0"/><text x="815" y="47" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#203d4e">Client (one per app)</text><path d="M917 85V487" stroke="#c4d2db" stroke-dasharray="4 5"/><path d="M137 130H381" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><text x="150" y="115" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">POST raw reading + revision</text><text x="285" y="170" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Validate source identity</text><text x="285" y="191" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Threshold or source alarm</text><path d="M387 225H646" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><text x="410" y="210" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">Publish CloudEvent</text><text x="550" y="265" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Deduplicate; retain latest</text><path d="M652 305H911" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><text x="676" y="290" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">Push SSE packet</text><text x="812" y="345" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Decode Sample → ViewModel</text><text x="812" y="368" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Apply display configuration</text><path d="M917 383V430" fill="none" stroke="#407b87" stroke-width="2" marker-end="url(#arrow)"/><text x="927" y="409" font-family="system-ui, sans-serif" font-size="12" font-weight="400" fill="#316773">snapshot</text><text x="804" y="463" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#203d4e">Console / Kit / ovui display</text><text x="25" y="407" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Occurrence ID identifies a reading.</text><text x="25" y="433" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">Source + ID identifies the entity.</text><text x="25" y="459" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#203d4e">The broker adds delivery state, not alarm logic.</text></svg>