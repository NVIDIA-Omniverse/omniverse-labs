name: Public release hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tracked files against public release manifest
        # The public repo must not contain internal-only paths such as _unpublished/.
        run: python scripts/check-public-release.py ${{ github.repository == 'NVIDIA-Omniverse/omniverse-labs' && '--strict' || '' }}

      - name: Build and verify a clean public export
        if: github.repository != 'NVIDIA-Omniverse/omniverse-labs'
        run: python scripts/check-public-release.py --export "$RUNNER_TEMP/public-export"
