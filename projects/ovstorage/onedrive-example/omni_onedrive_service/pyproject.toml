[project]
name = "omni-onedrive-storage-service"
version = "0.2.1"
description = "OneDrive storage service implementation of the NVIDIA Omniverse USD Storage API"
readme = "README.md"
license = "LicenseRef-NvidiaProprietary"
requires-python = ">=3.10"
authors = [
    { name = "NVIDIA CORPORATION & AFFILIATES" },
]
keywords = ["storage", "onedrive", "grpc", "rest", "api", "nvidia", "omniverse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "grpcio-reflection>=1.80.0",
    "grpc-interceptor>=0.15.4",
    "googleapis-common-protos>=1.74.0",
    "fastapi>=0.135.3",
    "pydantic>=2.12.5",
    "uvicorn>=0.44.0",
    "PyYAML>=6.0.3",
    "typer>=0.24.1",
    "filelock>=3.25.2",
    "tenacity>=9.1.4",
    "cachetools>=7.0.5",
    "requests>=2.33.1",
    "python-dotenv>=1.2.2",
]

[project.scripts]
omni-onedrive-storage-service = "omni_onedrive_storage_service.__main__:main"

[dependency-groups]
test = [
    "pytest>=9.0.2",
    "pytest-bdd>=8.1.0",
    "pytest-xdist>=3.8.0",
    "requests>=2.33.1",
]
dev = [
    "ruff>=0.15.9",
    "ty>=0.0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_onedrive_storage_service"]

[tool.hatch.build.targets.wheel.force-include]
"src/nvidia" = "nvidia"

[tool.hatch.build.targets.sdist]
include = ["src/"]

# ---------------------------------------------------------------------------
# Ruff (format + lint)
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
target-version = "py310"
line-length = 120
extend-exclude = ["src/nvidia"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E402", # module-level import not at top — false positive with SPDX license headers
    "E501", # line-too-long (formatter handles this)
    "B008", # function call in default arg — standard FastAPI pattern (Header, Query, etc.)
]

[tool.ruff.lint.isort]
known-first-party = ["omni_onedrive_storage_service"]

# ---------------------------------------------------------------------------
# ty (type checking)
# ---------------------------------------------------------------------------
[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = ["src/nvidia"]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "google.protobuf.**",
]
