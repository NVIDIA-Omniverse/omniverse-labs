openapi: 3.0.0
info:
  description: NVIDIA Omniverse Storage API FileFolder service.
  title: nvidia.omniverse.storage.filefolder.v1beta
  version: 0.26.0
security:
  - bearerAuth: []
tags:
  - name: nspect_id
    description: NSPECT-G2B8-GZ2M
paths:
  /filefolder/list/{folder_address}:
    get:
      summary: List sub-items at the given resource address
      description: List sub-items at the given resource address.
      operationId: list
      parameters:
        - : '#/components/parameters/folder_address'
        - : '#/components/parameters/max_page_size'
        - : '#/components/parameters/continuation_handle'
      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                : '#/components/schemas/ListResult'
    delete:
      summary: Delete the folder in case it exists and it is empty
      operationId: delete_folder
      parameters:
        - : '#/components/parameters/folder_address'
      responses:
        '204':
          description: Successful Response
  /filefolder/liststat/{folder_address}:
    get:
      summary: List sub-items at the given resource address and return metadata and resource identities
      description: List sub-items at the given resource address and return metadata and resource identities.
      operationId: list_stat
      parameters:
        - : '#/components/parameters/folder_address'
        - : '#/components/parameters/max_page_size'
        - : '#/components/parameters/continuation_handle'
      responses:
        '200':
          description: Successful Response.
          content:
            application/json:
              schema:
                : '#/components/schemas/ListStatResult'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    folder_address:
      required: true
      description: A Folder Address, following RFC 3986
      schema:
        type: string
        maxLength: 4096
        format: folder_address
      name: folder_address
      in: path
    max_page_size:
      in: query
      name: max_page_size
      description: The maximum size of the page to be returned by the server.
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 65536
        nullable: true
    continuation_handle:
      name: continuation_handle
      description: The continuation handle to fetch the next page of results.
      in: query
      required: false
      schema:
        type: string
        maxLength: 512
        format: page_handle
        nullable: true
  schemas:
    ListResult:
      properties:
        subfolder_addresses:
          title: Batch of folder addresses that can be listed.
          type: array
          maxItems: 65536
          items:
            type: string
            maxLength: 4096
            format: folder_address
        sub_resource_addresses:
          title: Batch of addresses for file objects.
          type: array
          maxItems: 65536
          items:
            type: string
            maxLength: 4096
            format: resource_address
        next_continuation_handle:
          type: string
          maxLength: 512
          format: page_handle
          nullable: true
          title: A handle by which enumerating can be continued.
      type: object
      required:
        - subfolder_addresses
        - sub_resource_addresses
      title: ListResult
      description: The response of the list operation.
    ListStatResult:
      properties:
        subfolder_addresses:
          title: Batch of resource addresses that can be listed.
          type: array
          maxItems: 65536
          items:
            type: string
            maxLength: 4096
            format: folder_address
        entries:
          title: Batch of detail data for file objects.
          type: array
          maxItems: 65536
          items:
            : '#/components/schemas/ListItem'
        next_continuation_handle:
          type: string
          maxLength: 512
          format: page_handle
          nullable: true
          title: A handle by which enumerating can be continued.
      type: object
      required:
        - subfolder_addresses
        - entries
      title: ListStatResult
      description: The response of the list operation.
    ListItem:
      properties:
        resource_address:
          type: string
          maxLength: 4096
          format: resource_address
        resource_identity:
          type: string
          maxLength: 4096
          format: resource_identity
        metadata:
          : '#/components/schemas/Metadata'
      type: object
      required:
        - resource_address
        - resource_identity
        - metadata
      title: ListItem
      description: A single item resolved by the list-stat operation delivering resource identities and metadata for each item.
    Metadata:
      properties:
        data_object_size:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          title: The size of the asset, in bytes.
          format: int64
        last_modified_timestamp:
          type: string
          format: date-time
          maxLength: 32
          title: Timestamp (ISO-8601 UTC) of the last modification of the object. Exact semantics and precision are storage-type specific. This field may be omitted.
      type: object
      required:
        - data_object_size
      title: Metadata
      description: A single resource metadata.
