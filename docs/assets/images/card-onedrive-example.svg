<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="OneDrive Storage API Sample: Kit sends an access token to the sample service, which maps requests to Microsoft Graph">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#121a22"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#5ce1e6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#5ce1e6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#76b900" stop-opacity="0"/>
      <stop offset="50%" stop-color="#76b900" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5ce1e6" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5ce1e6"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5764"/>
    </marker>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#rule)"/>

  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="104" fill="#76b900" font-size="26" font-weight="600" letter-spacing="3.5">OMNIVERSE STORAGE API</text>
    <text x="72" y="164" fill="#f2f5f7" font-size="50" font-weight="700">OneDrive Storage API Sample</text>
    <text x="72" y="212" fill="#8a97a4" font-size="27">Delegated Microsoft Graph access &#183; gRPC + REST</text>

    <rect x="72" y="300" width="292" height="168" rx="18" fill="#141c25" stroke="#2b3945" stroke-width="2"/>
    <text x="218" y="368" fill="#e6ebf0" font-size="38" font-weight="600" text-anchor="middle">Kit</text>
    <text x="218" y="408" fill="#7f8c99" font-size="23" text-anchor="middle">local or streaming</text>
    <text x="218" y="440" fill="#7f8c99" font-size="23" text-anchor="middle">Client Library</text>

    <rect x="454" y="288" width="292" height="192" rx="18" fill="#16211a" stroke="#76b900" stroke-width="3"/>
    <text x="600" y="352" fill="#ffffff" font-size="30" font-weight="700" text-anchor="middle">OneDrive Storage</text>
    <text x="600" y="394" fill="#ffffff" font-size="30" font-weight="700" text-anchor="middle">API Sample</text>
    <text x="600" y="440" fill="#9ecb5a" font-size="22" text-anchor="middle">maps Storage API to Graph</text>

    <rect x="836" y="300" width="292" height="168" rx="18" fill="#141c25" stroke="#2b3945" stroke-width="2"/>
    <text x="982" y="368" fill="#e6ebf0" font-size="38" font-weight="600" text-anchor="middle">Microsoft</text>
    <text x="982" y="410" fill="#e6ebf0" font-size="38" font-weight="600" text-anchor="middle">Graph</text>
    <text x="982" y="446" fill="#7f8c99" font-size="22" text-anchor="middle">/me/drive &#183; items</text>

    <line x1="372" y1="356" x2="446" y2="356" stroke="#5ce1e6" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="754" y1="356" x2="828" y2="356" stroke="#5ce1e6" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="446" y1="424" x2="372" y2="424" stroke="#4a5764" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowBack)"/>
    <line x1="828" y1="424" x2="754" y2="424" stroke="#4a5764" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowBack)"/>

    <text x="409" y="326" fill="#5ce1e6" font-size="19" text-anchor="middle">Bearer</text>
    <text x="791" y="326" fill="#5ce1e6" font-size="19" text-anchor="middle">forward</text>

    <g font-size="22" fill="#8a97a4">
      <rect x="72" y="566" width="242" height="58" rx="29" fill="#131a21" stroke="#28333d"/>
      <text x="193" y="603" text-anchor="middle">OneDrive for Business</text>
      <rect x="338" y="566" width="196" height="58" rx="29" fill="#131a21" stroke="#28333d"/>
      <text x="436" y="603" text-anchor="middle">Entra ID OIDC</text>
      <rect x="558" y="566" width="230" height="58" rx="29" fill="#131a21" stroke="#28333d"/>
      <text x="673" y="603" text-anchor="middle">Bearer or OBO</text>
      <rect x="812" y="566" width="200" height="58" rx="29" fill="#131a21" stroke="#28333d"/>
      <text x="912" y="603" text-anchor="middle">Sample code</text>
    </g>
  </g>
</svg>
